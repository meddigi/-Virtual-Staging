name: BerryCalc Release Dependency Cache

on:
  pull_request:
    paths:
      - ".github/workflows/berrycalc-release-cache.yml"
      - "release-cache-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warm-release-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FLUTTER_VERSION: "3.44.8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android build packages
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          pub-cache: true

      - name: Build release dummy with BerryCalc dependency graph
        shell: bash
        run: |
          set -euxo pipefail
          flutter create --platforms=android --org com.meddigi --project-name berrycalc release_cache_project
          cat > release_cache_project/pubspec.yaml <<'YAML'
          name: berrycalc
          description: BerryCalc release dependency cache warmer
          publish_to: none
          version: 3.2.2+322
          environment:
            sdk: ">=3.10.0 <4.0.0"
            flutter: ">=3.44.0 <4.0.0"
          dependencies:
            flutter:
              sdk: flutter
            flutter_localizations:
              sdk: flutter
            google_mobile_ads: ^9.0.0
            http: ^1.6.0
            in_app_purchase: ^3.3.0
            package_info_plus: ^10.2.1
            shared_preferences: ^2.5.5
            url_launcher: ^6.3.2
            audioplayers: ^6.8.1
            path_provider: ^2.1.6
            share_plus: ^13.3.0
          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^6.0.0
          flutter:
            uses-material-design: true
          YAML
          python3 - <<'PY'
          from pathlib import Path
          p=Path('release_cache_project/android/app/build.gradle.kts')
          s=p.read_text()
          s=s.replace('minSdk = flutter.minSdkVersion','minSdk = 24')
          s=s.replace('targetSdk = flutter.targetSdkVersion','targetSdk = 36')
          p.write_text(s)
          PY
          cd release_cache_project
          flutter pub get
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64 \
            --dart-define=APP_PACKAGE_ID=com.meddigi.berrycalc \
            --dart-define=DEMO_MONETIZATION=true \
            --dart-define=DEMO_ADS=true \
            --dart-define=DEMO_PURCHASES=true \
            --dart-define=USE_TEST_ADS=true
          flutter build appbundle --release \
            --dart-define=APP_PACKAGE_ID=com.meddigi.berrycalc \
            --dart-define=DEMO_MONETIZATION=true \
            --dart-define=DEMO_ADS=true \
            --dart-define=DEMO_PURCHASES=true \
            --dart-define=USE_TEST_ADS=true

      - name: Package Gradle release dependency cache
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          tar --zstd -cf out/release-modules.tar.zst -C "$HOME/.gradle/caches" modules-2
          split -b 300M -d -a 2 out/release-modules.tar.zst out/release-modules.part-
          rm out/release-modules.tar.zst
          sha256sum out/release-modules.part-* | tee out/RELEASE_CACHE_SHA256SUMS.txt
          du -h out/release-modules.part-* | tee out/RELEASE_CACHE_SIZES.txt

      - name: Upload release cache part 00
        uses: actions/upload-artifact@v4
        with:
          name: berrycalc-release-cache-part-00-${{ github.run_number }}
          path: out/release-modules.part-00
          compression-level: 0
          retention-days: 1
      - name: Upload release cache part 01
        if: ${{ hashFiles('out/release-modules.part-01') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: berrycalc-release-cache-part-01-${{ github.run_number }}
          path: out/release-modules.part-01
          compression-level: 0
          retention-days: 1
      - name: Upload release cache part 02
        if: ${{ hashFiles('out/release-modules.part-02') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: berrycalc-release-cache-part-02-${{ github.run_number }}
          path: out/release-modules.part-02
          compression-level: 0
          retention-days: 1
      - name: Upload release cache part 03
        if: ${{ hashFiles('out/release-modules.part-03') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: berrycalc-release-cache-part-03-${{ github.run_number }}
          path: out/release-modules.part-03
          compression-level: 0
          retention-days: 1
      - name: Upload release cache part 04
        if: ${{ hashFiles('out/release-modules.part-04') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: berrycalc-release-cache-part-04-${{ github.run_number }}
          path: out/release-modules.part-04
          compression-level: 0
          retention-days: 1
      - name: Upload release cache manifest
        uses: actions/upload-artifact@v4
        with:
          name: berrycalc-release-cache-manifest-${{ github.run_number }}
          path: |
            out/RELEASE_CACHE_SHA256SUMS.txt
            out/RELEASE_CACHE_SIZES.txt
          retention-days: 1
